<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이스 모자이크 — 얼굴 자동 마스킹</title>
  <meta name="description" content="사진 속 얼굴을 자동으로 감지하고 마스킹하는 페이스 모자이크 서비스입니다. 모든 처리는 브라우저 안에서만 이루어지며 외부 서버로 전송되지 않습니다." />
  <!-- 로컬 에셋: 외부 CDN 요청 없음 (프라이버시) -->
  <script defer src="vendor/face-api.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <!-- JSZip (로컬) for batch download -->
  <script defer src="vendor/jszip.min.js"></script>
</head>
<body>
  <!-- 배경 파티클 -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <!-- 헤더 -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="12" stroke="url(#g1)" stroke-width="2"/>
          <rect x="10" y="13" width="5" height="4" rx="1.5" fill="url(#g1)"/>
          <rect x="17" y="13" width="5" height="4" rx="1.5" fill="url(#g1)"/>
          <path d="M12 20 Q16 23 20 20" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="g1" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
              <stop stop-color="#a855f7"/>
              <stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="logo-text">페이스 <span class="logo-accent">모자이크</span></span>
    </div>
  </header>

  <!-- 메인 -->
  <main class="main">
    <!-- 업로드 섹션 -->
    <section class="upload-section" id="uploadSection">
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*" hidden multiple />
        <div class="upload-icon-wrap">
          <svg class="upload-icon" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="28" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>
            <path d="M32 20 L32 44" stroke="url(#ug)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M22 30 L32 20 L42 30" stroke="url(#ug)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 46 L44 46" stroke="url(#ug)" stroke-width="2.5" stroke-linecap="round"/>
            <defs>
              <linearGradient id="ug" x1="22" y1="20" x2="42" y2="46" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a855f7"/>
                <stop offset="1" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h2 class="upload-title">사진을 여기에 드래그하거나 클릭하여 선택</h2>
        <p class="upload-sub">JPG, PNG, WEBP 지원 · 최대 20MB</p>
        <button class="btn-primary" id="selectBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 11L5 8L8 10L11 6L14 11H2Z" fill="white" opacity=".7"/><rect x="2" y="2" width="12" height="11" rx="1.5" stroke="white" stroke-width="1.5" fill="none"/></svg>
          사진 선택하기
        </button>
      </div>
    </section>

    <!-- 이미지 갤러리/큐 (여러 장 처리 시) -->
    <section class="image-queue hidden" id="imageQueue">
      <div class="queue-header">
        <h3 class="queue-title">처리 중인 사진</h3>
        <span class="queue-count" id="queueCount">0/0</span>
      </div>
      <div class="queue-list" id="queueList">
        <!-- JS에서 썸네일 추가 -->
      </div>
    </section>

    <!-- 처리 섹션 (숨김) -->
    <section class="processing-section hidden" id="processingSection">
      <div class="canvas-container">
        <div class="canvas-wrap" id="canvasWrap">
          <img id="sourceImage" alt="원본 이미지" />
          <canvas id="maskCanvas"></canvas>
          <div class="scan-line" id="scanLine"></div>
        </div>
        <!-- 마스크 스타일 피커 -->
        <div class="mask-style-picker" id="maskStylePicker">
          <span class="style-picker-label">마스킹 스타일</span>
          <div class="style-options" id="styleOptions">
            <button class="style-opt active" data-style="mosaic" id="style-mosaic" title="모자이크">
              <span class="style-opt-icon">⬛</span>
              <span class="style-opt-name">모자이크</span>
            </button>
            <button class="style-opt" data-style="blur" id="style-blur" title="블러">
              <span class="style-opt-icon">🌫️</span>
              <span class="style-opt-name">블러</span>
            </button>
            <button class="style-opt" data-style="blackbar" id="style-blackbar" title="블랙바">
              <span class="style-opt-icon">▬</span>
              <span class="style-opt-name">블랙바</span>
            </button>
            <button class="style-opt" data-style="😊" id="style-smile" title="웃는 얼굴">😊</button>
            <button class="style-opt" data-style="😂" id="style-lol" title="눈물 웃음">😂</button>
            <button class="style-opt" data-style="🤩" id="style-star" title="별눈 얼굴">🤩</button>
            <button class="style-opt" data-style="🥳" id="style-party" title="파티 얼굴">🥳</button>
            <button class="style-opt" data-style="🤡" id="style-clown" title="광대">🤡</button>
            <button class="style-opt" data-style="👻" id="style-ghost" title="유령">👻</button>
            <button class="style-opt" data-style="🤖" id="style-robot" title="로봇">🤖</button>
            <button class="style-opt" data-style="😎" id="style-cool" title="쿨 얼굴">😎</button>
            <button class="style-opt" data-style="🙈" id="style-monkey" title="눈가리는 원숭이">🙈</button>
            <button class="style-opt" data-style="💀" id="style-skull" title="해골">💀</button>
            <button class="style-opt" data-style="🐱" id="style-cat" title="고양이">🐱</button>
            <button class="style-opt" data-style="🐶" id="style-dog" title="강아지">🐶</button>
            <button class="style-opt" data-style="⭐" id="style-starshape" title="별">⭐</button>
            <button class="style-opt" data-style="❓" id="style-question" title="물음표">❓</button>
          </div>
        </div>

        <div class="image-actions">
          <button class="btn-ghost" id="newImageBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8A6 6 0 1 1 8 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2 5V8H5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            새 사진
          </button>
          <button class="btn-secondary" id="rescanBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>
            다시 감지
          </button>
          <button class="btn-ghost" id="manualAddBtn" title="드래그로 직접 영역 지정">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M8 5.5V10.5M5.5 8H10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            수동 지정
          </button>
          <button class="btn-primary" id="downloadBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2 L8 11" stroke="white" stroke-width="1.5" stroke-linecap="round"/><path d="M5 8 L8 11 L11 8" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 13 L14 13" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
            저장하기
          </button>
          <button class="btn-secondary hidden" id="downloadAllBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 2 L4 11 M8 2 L8 11 M12 2 L12 11" stroke="currentColor" stroke-width="1.2" opacity=".5"/><path d="M2 10 L8 14 L14 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            일괄 저장하기 (.zip)
          </button>
        </div>
      </div>

      <!-- 로딩 오버레이 -->
      <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p class="loading-text" id="loadingText">AI 모델 로딩 중...</p>
      </div>
    </section>

    <!-- 얼굴 패널 -->
    <section class="faces-panel hidden" id="facesPanel">
      <div class="faces-header">
        <div class="faces-title-group">
          <h3 class="faces-title">감지된 얼굴</h3>
          <span class="faces-count" id="facesCount">0개</span>
        </div>
        <div class="faces-controls">
          <button class="ctrl-btn" id="maskAllBtn" title="전체 마스킹">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="12" height="12" rx="2" fill="currentColor" opacity=".3"/><rect x="3" y="5" width="3" height="2.5" rx=".8" fill="currentColor"/><rect x="8" y="5" width="3" height="2.5" rx=".8" fill="currentColor"/></svg>
            전체 마스킹
          </button>
          <button class="ctrl-btn" id="unmaskAllBtn" title="전체 해제">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7C2 7 4 4 7 4C10 4 12 7 12 7C12 7 10 10 7 10C4 10 2 7 2 7Z" stroke="currentColor" stroke-width="1.2"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/></svg>
            전체 해제
          </button>
        </div>
      </div>
      <div class="faces-grid" id="facesGrid"></div>
    </section>

    <!-- 빈 상태 (얼굴 없음) -->
    <div class="no-faces hidden" id="noFaces">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20" stroke="rgba(255,255,255,0.1)" stroke-width="2"/><path d="M16 24 L32 24" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/><circle cx="18" cy="19" r="2" fill="rgba(255,255,255,0.15)"/><circle cx="30" cy="19" r="2" fill="rgba(255,255,255,0.15)"/></svg>
      <p>얼굴이 감지되지 않았습니다</p>
      <span>다른 사진을 선택하거나 다시 감지해 보세요</span>
    </div>
  </main>

  <!-- 토스트 알림 -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
